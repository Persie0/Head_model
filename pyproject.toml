[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "head-model"
version = "0.1.0"
description = "Colab-friendly variable-view full-head reconstruction model"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.optional-dependencies]
train = ["tqdm>=4.66", "opencv-python-headless>=4.8"]
export = ["onnx>=1.16", "onnxruntime>=1.18"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
